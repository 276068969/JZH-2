version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: prison-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: prison_db
      MYSQL_USER: prison
      MYSQL_PASSWORD: prison123
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
      - ./docker/mysql/logs:/var/log/mysql
      - ./backend/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    networks:
      - prison-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: prison-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./docker/redis/data:/data
    networks:
      - prison-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prison-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/prison_db?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: prison
      SPRING_DATASOURCE_PASSWORD: prison123
      JWT_SECRET: cHJpc29uLW1hbmFnZW1lbnQtcGxhdGZvcm0tc2VjcmV0LWtleS0yMDI0
      JWT_EXPIRATION: 86400000
    ports:
      - "8080:8080"
    networks:
      - prison-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prison-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - prison-network

networks:
  prison-network:
    driver: bridge